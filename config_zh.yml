# ai-agent 配置文件
# 应用启动后会自动监听并重新加载此文件。
# 以“AI_AGENT_”开头的环境变量可以覆盖这里的配置值。
# 例如，AI_AGENT_API_ADDR 会覆盖 api.addr。

# API 服务配置
api:
  # HTTP 服务监听的 host:port 地址。
  # 环境变量覆盖：AI_AGENT_API_ADDR
  addr: "127.0.0.1:8088"
  
  # 可选的 API 鉴权密钥。
  # 必须通过环境变量设置——不要在本文件中保存密钥。
  # 环境变量覆盖：AI_AGENT_API_KEY
  api_key: ""

  # 认证模式：api_key、jwt、introspection 或 hybrid。
  # hybrid 同时接受现有静态密钥和一种配置好的 Bearer 校验策略。
  auth:
    mode: "introspection"
    # 生产多租户部署建议开启。开启后，每个非管理员租户都必须在下方配置
    # 相互隔离的 workspace_root。
    # 环境变量覆盖：AI_AGENT_API_REQUIRE_TENANT_WORKSPACE_ROOT
    require_tenant_workspace_root: false
    bearer:
      # hybrid 模式使用的 Bearer 策略：jwks 或 introspection。
      validation_mode: "jwks"
    jwt:
      # jwt/hybrid 模式下必填。只有签名、签发者、受众、过期时间和
      # 生效时间均通过校验后，才会读取 tenant_claim。
      issuer: "https://auth.thinktown.com"
      audience: "ai-agent"
      jwks_url: "https://auth.thinktown.com"
      tenant_claim: "user_code"
      allowed_algorithms: ["RS256"]
      # JWT 中的租户声明必须已存在于 api.tenants。
      require_known_tenant: true
      clock_skew_seconds: 30
      jwks_cache_ttl_seconds: 300
      jwks_request_timeout_seconds: 5
    introspection:
      # 第三方 GET 端点只验证 Authorization: Bearer Token。X-API-Key 仅与本地
      # API Key 比较，绝不转发给第三方。第三方端点必须使用 HTTPS。
      url: "https://api.thinktown.com/api/auth/check"
      # 支持使用点路径读取嵌套 JSON 响应字段。
      tenant_claim: "data.userid"
      active_claim: "data.active"
      # 可选响应声明约束。aud、exp 分别读取 data.aud、data.exp，并兼容顶层字段；
      # 配置后必须完全匹配。
      issuer: ""
      audience: ""
      require_expiration: false
      require_known_tenant: false
      # 公网端点保持 false；只有可信内网地址才显式开启。
      allow_private_network: false
      timeout_seconds: 3
      # 设为 0 可关闭缓存；成功结果仅以 Token 哈希作为缓存键。
      cache_ttl_seconds: 10

  # 可选的受信任租户身份。API Key 应由密钥管理系统注入运行时配置，
  # 不得提交到代码仓库。
  # jwt/introspection/hybrid 模式允许策略租户省略 api_key；admin 始终由本地配置决定，
  # 不会直接信任 JWT 中自报的管理员字段。
  # 上面的旧版 api_key 仍作为“default”管理员身份。
  # tenants:
  #   project_a:
  #     api_key: "<secret>"
  #     admin: false
  #     workspace_root: "./workspace/tenants/project_a"
  #     daily_llm_call_budget: 100
  #     daily_llm_cost_budget_usd: 10
  #     answer_pipeline_enforcement: strict
  #     answer_pipeline_required_stages:
  #       - fact_freshness_check
  #       - numeric_consistency_check
  #       - answer_uncertainty_calibrate
  #       - safety_guard_output
  #     # 除非 wiki.default_space 明确用于跨租户共享，否则应配置租户专属 Wiki 空间。
  #     wiki_space: "project-a"

# 存储配置
store:
  # 存储后端。支持：“sqlite”、“postgres”、“redis”、“memory”。
  # 环境变量覆盖：AI_AGENT_STORE_TYPE
  type: "sqlite"
  
  # 数据源连接字符串。
  # sqlite：SQLite 数据库路径（例如“data/agent.db”）。
  # postgres：PostgreSQL DSN（例如“postgresql://user:pass@host:port/dbname”）。
  # redis：Redis URL（例如“redis://host:port/db”）。
  # 环境变量覆盖：AI_AGENT_STORE_DSN
  dsn: "data/agent.db"

  # 向量搜索模式。支持：“in_process”、“pgvector”。
  # “pgvector”仅在 store.type 为“postgres”时生效，其他后端会忽略该配置。
  # 环境变量覆盖：AI_AGENT_STORE_VECTOR_SEARCH
  vector_search: "in_process"

  # 可选的 pgvector HNSW 索引维度，例如：本地备用向量为128，
  # OpenAI text-embedding-3-small 为1536，Gemini gemini-embedding-001 为3072。
  # 设置为0时，pgvector 使用精确扫描模式，不创建 ANN 索引。
  # 环境变量覆盖：AI_AGENT_STORE_PGVECTOR_DIMENSIONS
  pgvector_dimensions: 0
  # ParadeDB 混合检索调优：每个分支候选数 = limit * multiplier，RRF K 控制排名平滑度。
  # 环境变量覆盖：AI_AGENT_STORE_PARADEDB_CANDIDATE_MULTIPLIER、AI_AGENT_STORE_PARADEDB_RRF_K、
  # AI_AGENT_STORE_PARADEDB_SLOW_QUERY_THRESHOLD_MS
  paradedb_candidate_multiplier: 4
  paradedb_rrf_k: 60
  paradedb_slow_query_threshold_ms: 250

  # 进程内执行余弦/关键词排序前，从磁盘加载的最近 Memory 最大行数。
  # 设置为0时使用默认值200。
  # 环境变量覆盖：AI_AGENT_STORE_MEMORY_CANDIDATE_LIMIT
  memory_candidate_limit: 200

# Orchestrator 编排执行配置
orchestrator:
  # 执行模式。支持：“eino”、“legacy”、“step”、“adk”、“multiagent”。
  # 环境变量覆盖：AI_AGENT_ORCHESTRATOR_MODE
  mode: "eino"
  
  # 允许同时运行的最大任务协程数。
  # 环境变量覆盖：AI_AGENT_ORCHESTRATOR_MAX_CONCURRENT_TASKS
  max_concurrent_tasks: 10
  
  # run-all 任务循环的活跃执行时间上限，单位为秒。等待人工审批的时间不计入，
  # 但显式取消和服务关闭仍会立即生效。
  # 设置为0时使用默认值600秒。
  # 环境变量覆盖：AI_AGENT_ORCHESTRATOR_RUN_ALL_TIMEOUT_SECONDS
  run_all_timeout_seconds: 600

# Multi-Agent 团队与 DAG 灰度设置。环境变量覆盖：
# AI_AGENT_MULTIAGENT_TEAM、AI_AGENT_MULTIAGENT_RUNTIME、
# AI_AGENT_MULTIAGENT_DAG_CANARY_PERCENT。
multiagent:
  team: "kb_qa"
  runtime: "legacy"
  dag_canary_percent: 0

# 持久化人工审批配置
approval:
  # pending 审批的最长有效期，单位为秒；设置为0时禁用过期。
  # 环境变量覆盖：AI_AGENT_APPROVAL_TTL_SECONDS
  ttl_seconds: 86400
  # consumed/expired 审批的保留天数；设置为0时禁用清理。
  # 环境变量覆盖：AI_AGENT_APPROVAL_RETENTION_DAYS
  retention_days: 30

# 最终答案质量流水线
answer_pipeline:
  # 是否启用最终答案审计流水线。
  enabled: true
  # 执行策略：observe、advisory 或 strict。
  enforcement: observe
  # 为答案审计阶段预留的 Token 数。
  audit_token_reserve: 4000
  # 单个审计阶段的超时时间，单位为秒。
  stage_timeout_seconds: 20
  # 独立审计阶段是否允许并行执行。
  parallel_audits: true
  # 必需阶段失败后的任务状态：partial 或其他受支持策略。
  on_required_stage_failure: partial
  required_stages:
    - fact_freshness_check
    - numeric_consistency_check
    - answer_uncertainty_calibrate
    - safety_guard_output
  stage_token_budgets:
    citation_verify: 600
    fact_freshness_check: 900
    numeric_consistency_check: 900
    answer_uncertainty_calibrate: 1000
    safety_guard_output: 600

# LLM 提供商配置
llm:
  # 目标 LLM 提供商。支持：“openai-responses”、“openai”、“gemini”、“ollama”、“litellm”。
  # 环境变量覆盖：AI_AGENT_LLM_PROVIDER
  provider: "openai-responses"
  
  # 通用备用 LLM API Key。
  # 环境变量覆盖：AI_AGENT_LLM_API_KEY
  api_key: ""
  
  # 各提供商专用的 LLM API Key（优先级高于 llm.api_key）。
  # 环境变量覆盖（无 AI_AGENT_ 前缀）：OPENAI_API_KEY、GEMINI_API_KEY、GOOGLE_API_KEY
  openai_api_key: ""
  gemini_api_key: ""
  google_api_key: ""
  
  # LLM 模型名称。留空时使用提供商默认模型。
  # 例如：“gpt-4o-mini”、“gemini-2.5-flash”。
  # 环境变量覆盖：AI_AGENT_LLM_MODEL
  model: ""
  
  # 使用本地代理或自托管 API 端点时，可设置自定义 API 基础 URL。
  # 环境变量覆盖：AI_AGENT_LLM_BASE_URL
  base_url: ""
  
  # 请求超时时间，单位为秒。
  # 环境变量覆盖：AI_AGENT_LLM_TIMEOUT_SECONDS
  timeout_seconds: 90
  # 就绪探测级别：config_only、gateway 或 inference。
  # gateway 保持默认行为：检查 LiteLLM 存活状态和模型访问能力，
  # 直接提供商仅确认已配置，不执行真实验证。
  # inference 会为每个已配置场景发送最小结构化生成请求，可能产生费用。
  # 环境变量覆盖：AI_AGENT_LLM_READINESS_MODE
  readiness_mode: "gateway"
  # 缓存就绪探测结果，以减少探测流量和推理费用。
  # readiness_mode 为 inference 时建议增大此值。
  # 环境变量覆盖：AI_AGENT_LLM_READINESS_CACHE_TTL_SECONDS
  readiness_cache_ttl_seconds: 10
  # 运行时韧性配置。任一值设为0可禁用对应保护机制。
  circuit_breaker_failure_threshold: 5
  circuit_breaker_cooldown_seconds: 30
  retry_budget_per_minute: 60
  # 每个任务默认的逻辑 LLM 调用上限；设置为0表示不限制。
  # fallback 场景计为另一次调用，同一场景内的重试不重复计数。
  max_calls_per_task: 0
  # 每个任务默认的预估美元费用上限；设置为0表示不限制。启用费用限制时，
  # 所有被选中的生成场景都必须配置输入/输出价格。共享价格配置在 llm.gateway，
  # 场景专属价格配置在 llm.scenes；无法提供价格时，任务请求中的
  # llm_cost_budget_usd 必须保持为0。
  max_estimated_cost_usd_per_task: 0
  context_compression_trace_threshold: 8
  # 可选：累计 Trace Token 超过此总量时也触发上下文压缩。
  # 默认值0表示禁用基于 Token 的触发方式；适用于步骤不多但 Observation 很大的任务
  #（例如代码执行输出）。
  # 环境变量覆盖：AI_AGENT_LLM_CONTEXT_COMPRESSION_TOKEN_THRESHOLD
  # context_compression_token_threshold: 40000

  # Planner Trace 上下文限制。即使可选的 LLM 上下文压缩器被禁用或尚未触发，
  # 这些限制仍会保护每次 Planning 调用。
  planner_trace_max_items: 4
  planner_observation_max_chars: 800
  planner_evidence_max_items: 8
  planner_evidence_line_max_chars: 300
  planner_trace_max_chars: 5000

  # 共享网关默认配置。LiteLLM 提供兼容 OpenAI 的
  # /v1/chat/completions 端点，以及在 LiteLLM 中配置的模型别名。
  gateway:
    provider: "litellm"
    api_key: ""
    base_url: "http://127.0.0.1:4000/v1/chat/completions"
    timeout_seconds: 120
    # 可选价格，仅用于预估费用指标。
    # input_cost_per_million_usd: 2.0
    # output_cost_per_million_usd: 8.0

  # 按调用场景配置。省略的字段先继承 gateway，再继承旧版全局配置。
  # 动态路由适用于生成场景；embedding 和 adk 不支持路由。
  # 可设置 fallback_scene: ""、max_retries: 0 或 min_remaining_tokens: 0，
  # 为单个场景显式清除对应的网关策略。
  scenes:
    task_planner:
      model: "agent-planner"
      fallback_scene: "task_planner_legacy"
      # 可选价格和动态路由：
      # input_cost_per_million_usd: 2.0
      # output_cost_per_million_usd: 8.0
      # min_remaining_tokens: 2000
      # routes:
      #   - target_scene: "task_planner_economy"
      #     max_remaining_tokens: 4000
      #     min_step_count: 2
      #   - target_scene: "task_planner_quality"
      #     intents: ["coding", "research"]
      #     complexities: ["high"]
      #     cost_tiers: ["unconstrained"]
      #     latency_tiers: ["flexible"]
      #     quality_tiers: ["quality"]
    task_planner_legacy:
      model: "agent-planner-legacy"
      max_retries: 1
    task_finalizer:
      model: "agent-writer"
      timeout_seconds: 30
      fallback_scene: "task_finalizer_legacy"
    task_finalizer_legacy:
      model: "agent-writer-legacy"
      max_retries: 1
    multiagent_planner:
      model: "agent-planner"
      fallback_scene: "multiagent_planner_legacy"
    multiagent_planner_legacy:
      model: "agent-planner-legacy"
      max_retries: 1
    multiagent_replanner:
      model: "agent-planner-fallback"
      fallback_scene: "multiagent_replanner_legacy"
    multiagent_replanner_legacy:
      model: "agent-planner-fallback-legacy"
      max_retries: 1
    multiagent_writer:
      model: "agent-writer"
      fallback_scene: "multiagent_writer_legacy"
    multiagent_writer_legacy:
      model: "agent-writer-legacy"
      max_retries: 1
    embedding:
      model: "agent-embedding"
      base_url: "http://127.0.0.1:4000/v1/embeddings"

    # 可选场景。需要时直接在当前 scenes 映射下取消注释。
  #   task_planner_economy:
  #     model: "agent-planner-fast"
  #   task_planner_quality:
  #     model: "agent-planner-strong"
  #   citation_verifier:
  #     model: "agent-verifier"
  #   safety_guard:
  #     model: "agent-safety"
  #   tool_argument_repair:
  #     model: "agent-fast"
  #   intent_router:
  #     model: "agent-fast"
  #   memory_conflict_resolver:
  #     model: "agent-verifier"
  #   vision_analyzer:
  #     # 所选模型必须支持图像输入。LiteLLM 可将该别名路由到任意
  #     # 兼容 OpenAI 的多模态后端。
  #     model: "agent-vision"
  #   code_reviewer:
  #     model: "agent-reviewer"
  #   test_generator:
  #     model: "agent-coder"
  #   failure_diagnoser:
  #     model: "agent-diagnoser"
  #   plan_critic:
  #     model: "agent-reviewer"
  #   prompt_injection_detector:
  #     model: "agent-safety"
  #   evidence_relevance_filter:
  #     model: "agent-reranker"
  #   evidence_conflict_resolver:
  #     model: "agent-verifier"
  #   source_credibility_scorer:
  #     model: "agent-verifier"
  #   fact_freshness_checker:
  #     model: "agent-verifier"
  #   numeric_consistency_checker:
  #     model: "agent-verifier"
  #   answer_uncertainty_calibrator:
  #     model: "agent-verifier"
  #   context_compressor:
  #     model: "agent-fast"
  #   answer_verifier:
  #     model: "agent-verifier"
  #   memory_summarizer:
  #     model: "agent-fast"
  #   rag_query_rewriter:
  #     model: "agent-fast"
  #   rag_reranker:
  #     model: "agent-reranker"
  #   adk:
  #     provider: "gemini"
  #     model: "gemini-2.5-flash"

# Embedding 配置
embedding:
  # Embedding 模型名称。留空时使用提供商默认的 Embedding 模型
  #（例如 gemini-embedding-001 或 text-embedding-3-small），
  # 而不是默认的文本生成模型。
  # 环境变量覆盖：AI_AGENT_EMBEDDING_MODEL
  model: ""

# 检索增强生成（RAG）配置
rag:
  # 可选的外部搜索/RAG API 端点 URL。
  # 环境变量覆盖：AI_AGENT_RAG_SEARCH_URL
  search_url: ""
  
  # RAG 传输方式：“MCP”执行 initialize + tools/call；“POST”和“GET”
  # 用于普通 REST 端点。以 /mcp 结尾的 URL 始终按 MCP Streamable HTTP
  # 端点处理，即使环境变量将其覆盖为 POST。
  # 环境变量覆盖：AI_AGENT_RAG_SEARCH_METHOD
  search_method: "MCP"

  # MCP 服务端暴露的搜索工具名称。
  # 环境变量覆盖：AI_AGENT_RAG_TOOL_NAME
  tool_name: "rag_search"

  # RAG 搜索端点的 Authorization Token/Header。
  # 必须通过环境变量设置——不要在本文件中保存密钥。
  # 环境变量覆盖：AI_AGENT_RAG_AUTHORIZATION
  authorization: ""

  # 上下文检索模式。“jit”允许 Planner 按需调用检索工具；
  # “prefetch”保留旧版 Planning 前预取流程。
  # 环境变量覆盖：AI_AGENT_RAG_CONTEXT_MODE
  context_mode: "jit"

  # 每个任务的限制。网络调用数统计真实外部搜索；检索循环数统计不同的
  # 搜索尝试；等价的缓存命中会直接复用，不创建新循环。
  # 环境变量覆盖：AI_AGENT_RAG_JIT_SEARCH_MAX_CALLS、
  # AI_AGENT_RAG_JIT_RETRIEVAL_MAX_CYCLES、
  # AI_AGENT_RAG_JIT_FETCH_MAX_ITEMS,
  # AI_AGENT_RAG_JIT_RAG_FETCH_MAX_BYTES,
  # AI_AGENT_RAG_JIT_MEMORY_FETCH_MAX_BYTES
  jit_search_max_calls: 2
  jit_retrieval_max_cycles: 2
  jit_fetch_max_items: 3
  jit_rag_fetch_max_bytes: 6000
  jit_memory_fetch_max_bytes: 2000

  # 立即注入同一会话最近完成的任务，即使异步 Embedding 尚未完成。
  # 设置为 0 可关闭直接会话历史。
  # 环境变量覆盖：AI_AGENT_RAG_SESSION_RECENT_TASK_LIMIT
  session_recent_task_limit: 5

  # Planner Prompt 中最多包含的重排后 Memory 数量。
  # 环境变量覆盖：AI_AGENT_RAG_MAX_PROMPT_MEMORIES
  max_prompt_memories: 3

  # 单条 Memory 合并 Goal、Findings 和 Answer 后的 UTF-8 字节预算。
  # 环境变量覆盖：AI_AGENT_RAG_MAX_MEMORY_BYTES
  max_memory_bytes: 2500

  # 单个 Planner Prompt 中所有 Memory 共享的 UTF-8 字节预算。
  # 环境变量覆盖：AI_AGENT_RAG_MAX_MEMORY_PROMPT_BYTES
  max_memory_prompt_bytes: 8000

  # 结构化解析失败时，最多保留的第三方原始文本字节数。
  # 环境变量覆盖：AI_AGENT_RAG_MAX_RAW_FALLBACK_BYTES
  max_raw_fallback_bytes: 4000

# 通用 MCP Streamable HTTP 服务。启动时通过 tools/list 发现工具，并以
# <tool_prefix>_<远程工具名> 注册。修改此列表目前需要重启服务。
mcp:
  servers: []
  # 示例：
  # servers:
  #   - name: "github"
  #     url: "https://mcp.example.com/mcp"
  #     # 从指定环境变量读取凭据。裸 Token 会自动添加 Bearer；
  #     # 已包含认证方案的值会保持原样。
  #     authorization_env: "GITHUB_MCP_AUTHORIZATION"
  #     # 默认为“mcp_<name>”，例如 mcp_github_search_code。
  #     tool_prefix: "mcp_github"
  #     # 远程工具默认是高风险，需要经过现有审批流程。
  #     risk_level: "high"
  #     timeout_seconds: 15
  #     # 此服务允许发现的最大工具数（默认64）。
  #     max_tools: 64
  #     # 必需服务发现失败时阻止启动；可选服务失败会被隔离并记录。
  #     required: false
  #     disabled: false
  #     # 私网/回环地址默认拒绝，必须显式开启。
  #     allow_private_network: false

# 可选的只读 LLM Wiki 适配器。仅注册 wiki_search 与 wiki_fetch，
# 不开放写入、摄取、提交、Schema 或空间管理工具。修改后需要重启服务。
wiki:
  # Streamable HTTP MCP 端点，例如 http://127.0.0.1:18765/mcp。
  # 环境变量覆盖：AI_AGENT_WIKI_URL
  url: ""
  # 也可直接只读访问 llm-wiki 工作目录。可指向包含 AGENTS.md/raw/wiki
  # 的仓库根目录，或直接指向 wiki 目录。与 url 互斥。
  # 环境变量覆盖：AI_AGENT_WIKI_DIRECTORY
  directory: ""
  # 保存认证值的环境变量名称；凭据本身禁止写入本文件。
  # 环境变量覆盖：AI_AGENT_WIKI_AUTHORIZATION_ENV
  authorization_env: ""
  # 共享的默认空间。多租户隔离优先使用 api.tenants.<tenant>.wiki_space。
  # 环境变量覆盖：AI_AGENT_WIKI_DEFAULT_SPACE
  default_space: ""
  timeout_seconds: 15
  search_top_k: 5
  fetch_max_items: 3
  fetch_max_bytes: 12000
  # 回环/私网端点默认拒绝，必须显式开启。
  allow_private_network: false
  # 已配置的 Wiki 无法初始化时是否阻止服务启动。
  required: false

# 日志配置
log:
  # 日志详细级别。支持：“debug”、“info”、“warn”、“error”。
  # 环境变量覆盖：AI_AGENT_LOG_LEVEL
  level: "info"

  # 是否持续将 JSON 日志写入标准输出。
  # 环境变量覆盖：AI_AGENT_LOG_CONSOLE
  console: true

  # 是否按级别写入各自的每日轮转文件，例如
  # logs/info-2026-07-15.log 和 logs/error-2026-07-15.log。
  # 环境变量覆盖：AI_AGENT_LOG_FILE_ENABLED
  file_enabled: true

  # 每个 HTTP 请求写入一条 JSON 记录到 access-YYYY-MM-DD.log。
  # 不记录 Authorization、X-API-Key、Cookie、查询字符串和请求/响应正文。
  # 环境变量覆盖：AI_AGENT_LOG_ACCESS_ENABLED
  access_enabled: true

  # 轮转日志文件目录。
  # 环境变量覆盖：AI_AGENT_LOG_DIRECTORY
  directory: "logs"

  # 删除超过指定天数的轮转文件。设置为0表示永久保留。
  # 环境变量覆盖：AI_AGENT_LOG_RETENTION_DAYS
  retention_days: 30

# OpenTelemetry 配置
telemetry:
  # 是否启用 OTLP Trace 和 Metrics 导出。关闭后，埋点保持空操作。
  # 环境变量覆盖：AI_AGENT_TELEMETRY_ENABLED
  enabled: true

  # OTLP HTTP 端点。支持“host:port”或完整 URL，例如“http://127.0.0.1:4318”。
  # 环境变量覆盖：AI_AGENT_TELEMETRY_ENDPOINT
  endpoint: "127.0.0.1:4318"

  # 部署环境的资源属性。
  # 环境变量覆盖：AI_AGENT_TELEMETRY_ENVIRONMENT
  environment: "dev"

  # Exporter 模式。支持：“otlp”、“stdout”。
  # 环境变量覆盖：AI_AGENT_TELEMETRY_EXPORTER
  exporter: "otlp"

# Tool 执行配置
tool:
  # 自定义 Tool 的执行超时时间，单位为秒。
  # 环境变量覆盖：AI_AGENT_TOOL_TIMEOUT_SECONDS
  timeout_seconds: 120

# Skill 发现配置
skill:
  # 扫描 Skill 的根目录（其中包含 <name>/SKILL.md）。
  # 环境变量覆盖：AI_AGENT_SKILL_ROOT
  root: "skills"

# Web 搜索配置
search:
  # 默认 Web 搜索 API URL（例如 Firecrawl、DuckDuckGo）。
  # 默认使用 Firecrawl 搜索端点：https://api.firecrawl.dev/v1/search
  # 环境变量覆盖：AI_AGENT_SEARCH_URL
  url: "https://api.firecrawl.dev/v1/search"

  # 搜索提供商的 API Key 或 Authorization Token。
  # 环境变量覆盖：FIRECRAWL_API_KEY 或 AI_AGENT_SEARCH_API_KEY
  api_key: ""

# Langfuse Prompt 管理配置
langfuse:
  # 是否开启从 Langfuse 平台动态获取 Prompt 模板。
  # 环境变量覆盖：LANGFUSE_ENABLED
  enabled: false

  # Langfuse 服务的主机地址。
  # 环境变量覆盖：LANGFUSE_BASE_URL
  host: "https://cloud.langfuse.com"

  # Langfuse 公钥 (pk-lf-...)
  # 环境变量覆盖：LANGFUSE_PUBLIC_KEY
  public_key: ""

  # Langfuse 私钥 (sk-lf-...)
  # 环境变量覆盖：LANGFUSE_SECRET_KEY
  secret_key: ""

  # 启动时获取 teams.yaml 中显式命名的全部 Prompt；仅在确认不存在时，
  # 使用 system_prompt 创建。多实例部署中，普通副本应保持关闭。
  # 环境变量覆盖：LANGFUSE_BOOTSTRAP_MISSING_PROMPTS
  bootstrap_missing_prompts: false

  # Prompt 同步失败时的启动策略："fail" 或 "warn"。
  # 环境变量覆盖：LANGFUSE_BOOTSTRAP_FAILURE_POLICY
  bootstrap_failure_policy: "fail"

  # 启动同步总超时时间，单位为秒。设置为0时使用15秒。
  # 环境变量覆盖：LANGFUSE_BOOTSTRAP_TIMEOUT_SECONDS
  bootstrap_timeout_seconds: 15
