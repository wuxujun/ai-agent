# Dedicated test dependencies only. This does not deploy or certify two nodes.
name: ai-agent-ha-test
services:
  postgres:
    image: pgvector/pgvector:0.8.2-pg17-bookworm
    # Two default 50-connection pools plus PostgreSQL reserves and other clients.
    command: ["postgres", "-c", "max_connections=150"]
    environment:
      POSTGRES_DB: ai_agent_ha
      POSTGRES_USER: ai_agent_ha
      POSTGRES_PASSWORD: ${HA_POSTGRES_PASSWORD:?provide a dedicated test database password}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai_agent_ha -d ai_agent_ha"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7.4.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres-data:
  redis-data:
