services:
  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277}
    command:
      [
        "--config",
        "/app/config.yaml",
        "--port",
        "4000",
        "--num_workers",
        "1",
        "--telemetry",
        "False",
      ]
    init: true
    restart: unless-stopped
    cpus: ${LITELLM_CPU_LIMIT:-1.0}
    mem_limit: ${LITELLM_MEMORY_LIMIT:-2g}
    memswap_limit: ${LITELLM_MEMORY_LIMIT:-2g}
    pids_limit: ${LITELLM_PIDS_LIMIT:-128}
    ports:
      - "${LITELLM_BIND_ADDRESS:-127.0.0.1}:${LITELLM_PORT:-4000}:4000"
    environment:
      DATABASE_URL: ${LITELLM_DATABASE_URL:-postgresql://${POSTGRES_USER:-litellm}:${POSTGRES_PASSWORD:-litellm-local-change-me}@postgres:5432/${POSTGRES_DB:-litellm}}
      STORE_MODEL_IN_DB: "True"
      LITELLM_SALT_KEY: ${LITELLM_SALT_KEY:?set LITELLM_SALT_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      UI_USERNAME: ${LITELLM_UI_USERNAME:-admin}
      UI_PASSWORD: ${LITELLM_UI_PASSWORD:?set LITELLM_UI_PASSWORD}
      DISABLE_ADMIN_UI: "False"
      SERVER_ROOT_PATH: ${SERVER_ROOT_PATH:-}
      DOCS_URL: /docs
      ROOT_REDIRECT_URL: /ui
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY:-}
      DASHSCOPE_API_BASE: ${DASHSCOPE_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_API_BASE: ${GEMINI_API_BASE:-https://generativelanguage.googleapis.com}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_BASE: ${GROQ_API_BASE:-https://api.groq.com/openai/v1}
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_API_BASE: ${XAI_API_BASE:-https://api.x.ai/v1}
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NVIDIA_NIM_API_BASE: ${NVIDIA_NIM_API_BASE:-https://integrate.api.nvidia.com/v1}
      SMTP_HOST: ${SMTP_HOST:-smtp.exmail.qq.com}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SENDER_EMAIL: ${SMTP_SENDER_EMAIL:-}
      SMTP_TLS: ${SMTP_TLS:-False}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-True}
      EMAIL_INCLUDE_API_KEY: ${LITELLM_EMAIL_INCLUDE_API_KEY:-False}
      PROXY_BASE_URL: ${PROXY_BASE_URL:-http://127.0.0.1:4000}
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s

  model-bootstrap:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:9ef6f45bc0104940571765e610c52a1d761b5ec85efcd193795281086ee61277}
    entrypoint: ["python", "/bootstrap/bootstrap_models.py"]
    init: true
    restart: unless-stopped
    cpus: ${LITELLM_BOOTSTRAP_CPU_LIMIT:-0.25}
    mem_limit: ${LITELLM_BOOTSTRAP_MEMORY_LIMIT:-128m}
    memswap_limit: ${LITELLM_BOOTSTRAP_MEMORY_LIMIT:-128m}
    pids_limit: ${LITELLM_BOOTSTRAP_PIDS_LIMIT:-32}
    environment:
      LITELLM_BASE_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_MODEL_BOOTSTRAP_MANIFEST: ${LITELLM_MODEL_BOOTSTRAP_MANIFEST:-/bootstrap/bootstrap-models.json}
      LITELLM_MODEL_BOOTSTRAP_MANIFESTS: ${LITELLM_MODEL_BOOTSTRAP_MANIFESTS:-}
      LITELLM_MODEL_BOOTSTRAP_INTERVAL_SECONDS: ${LITELLM_MODEL_BOOTSTRAP_INTERVAL_SECONDS:-60}
      LITELLM_MODEL_BOOTSTRAP_TIMEOUT_SECONDS: ${LITELLM_MODEL_BOOTSTRAP_TIMEOUT_SECONDS:-10}
    volumes:
      - ./bootstrap_models.py:/bootstrap/bootstrap_models.py:ro
      - ./bootstrap-models.json:/bootstrap/bootstrap-models.json:ro
      - ./qwen-models.json:/bootstrap/qwen-models.json:ro
    depends_on:
      litellm:
        condition: service_healthy
    stop_grace_period: 10s

  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    profiles: ["bundled-db"]
    restart: unless-stopped
    cpus: ${POSTGRES_CPU_LIMIT:-0.5}
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    memswap_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    pids_limit: ${POSTGRES_PIDS_LIMIT:-128}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-litellm}
      POSTGRES_USER: ${POSTGRES_USER:-litellm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-litellm-local-change-me}
    ports:
      - "${POSTGRES_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - litellm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s

volumes:
  litellm_postgres_data:
