# Install these locations inside the HTTPS server block for the public gateway.
# Replace the upstream address if LiteLLM is not reachable on host port 4000.

location = /litellm {
    return 301 /litellm/;
}

location ^~ /litellm/ {
    # The trailing slash strips /litellm/ before forwarding to LiteLLM.
    proxy_pass http://127.0.0.1:4000/;
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Prefix /litellm;

    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    proxy_buffering off;
}
