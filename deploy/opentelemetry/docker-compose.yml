services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: otel-collector
    command: ["--config=${OTEL_COLLECTOR_CONFIG_PATH:-/etc/otelcol/config.yaml}"]
    restart: unless-stopped
    environment:
      LANGFUSE_OTEL_ENDPOINT: ${LANGFUSE_OTEL_ENDPOINT:-}
      LANGFUSE_OTEL_AUTHORIZATION: ${LANGFUSE_OTEL_AUTHORIZATION:-}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - ./otel-collector-langfuse.yaml:/etc/otelcol/config-langfuse.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    depends_on:
      - jaeger
      - tempo

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - otel-collector

  jaeger-storage-init:
    image: busybox:1.37.0
    container_name: jaeger-storage-init
    user: "0:0"
    command:
      - sh
      - -c
      - mkdir -p /badger/data /badger/key && chown 10001:10001 /badger /badger/data /badger/key
    volumes:
      - jaeger-data:/badger
    restart: "no"

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: jaeger
    user: "10001:10001"
    restart: unless-stopped
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=badger
      - BADGER_EPHEMERAL=false
      - BADGER_DIRECTORY_VALUE=/badger/data
      - BADGER_DIRECTORY_KEY=/badger/key
    volumes:
      - jaeger-data:/badger
    depends_on:
      jaeger-storage-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:16686:16686"

  tempo:
    image: grafana/tempo:2.7.2
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    restart: unless-stopped
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "127.0.0.1:3200:3200"

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  prometheus-data:
    name: opentelemetry_prometheus-data
  tempo-data:
    name: opentelemetry_tempo-data
  grafana-data:
    name: opentelemetry_grafana-data
  jaeger-data:
    name: opentelemetry_jaeger-data
