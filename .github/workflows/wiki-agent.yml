name: wiki-agent

on:
  push:
    paths:
      - "wiki-agent/**"
      - ".github/workflows/wiki-agent.yml"
  pull_request:
    paths:
      - "wiki-agent/**"
      - ".github/workflows/wiki-agent.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: wiki-agent

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env:
          POSTGRES_USER: wiki
          POSTGRES_PASSWORD: wiki
          POSTGRES_DB: wiki
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wiki -d wiki"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: wiki-agent/go.mod
          cache-dependency-path: wiki-agent/go.sum
      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://wiki:wiki@localhost:5432/wiki?sslmode=disable
        run: go test -tags integration -race -count=1 ./...
      - name: Build
        run: make build
