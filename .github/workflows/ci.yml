name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Format check
        run: |
          unformatted="$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
      - name: Static analysis
        run: go vet ./...
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./cmd/llm-eval ./internal/...
      - name: Compose validation
        env:
          OPENAI_API_KEY: test-openai-key
          GEMINI_API_KEY: test-gemini-key
          LITELLM_MASTER_KEY: test-master-key
          LITELLM_SALT_KEY: test-salt-key-at-least-32-characters
          LITELLM_UI_PASSWORD: test-ui-password
          LANGFUSE_PUBLIC_KEY: test-langfuse-public-key
          LANGFUSE_SECRET_KEY: test-langfuse-secret-key
          LANGFUSE_OTEL_HOST: http://langfuse.invalid
        run: docker compose -f deploy/litellm/compose.yaml config --quiet
      - name: Secret scan
        run: >-
          docker run --rm
          -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.27.2
          git --redact --verbose --config /repo/.gitleaks.toml /repo

  vulnerability-scan:
    name: Go vulnerability reachability scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned scanner
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
      - name: Scan reachable vulnerabilities
        shell: bash
        run: |
          mkdir -p artifacts/security
          date -u +%FT%TZ | tee artifacts/security/scanned-at.txt
          go version | tee artifacts/security/go-version.txt
          govulncheck -version | tee artifacts/security/scanner-version.txt
          govulncheck -show verbose ./... 2>&1 | tee artifacts/security/govulncheck.txt
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-vulnerability-report
          path: artifacts/security/
          retention-days: 14

  external-integration:
    name: PostgreSQL, pgvector, and Redis integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.2-pg17-bookworm
        env:
          POSTGRES_DB: ai_agent_test
          POSTGRES_USER: ai_agent
          POSTGRES_PASSWORD: integration-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ai_agent -d ai_agent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7.4.2-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AI_AGENT_RUN_EXTERNAL_INTEGRATION: "true"
      TEST_POSTGRES_DSN: postgres://ai_agent:integration-only-password@127.0.0.1:5432/ai_agent_test?sslmode=disable
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: External backend contracts
        # Discover new TestExternal* contracts automatically, including API recovery.
        # ParadeDB is optional: its test reports a skip on this pgvector image.
        # Serialize packages that initialize the same dedicated database schema.
        run: >-
          go test -race -v -count=1 -timeout=3m -p=1
          ./internal/...
          -run '^(TestExternal|TestApprovalBusAcrossRedisClients$)'
