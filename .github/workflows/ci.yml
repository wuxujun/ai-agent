name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: true
      - name: Format check
        run: |
          unformatted="$(find cmd internal -name '*.go' -type f -print0 | xargs -0 gofmt -l)"
          test -z "$unformatted"
      - name: Unit tests
        run: go test ./...
      - name: Race tests
        run: go test -race ./internal/llm/... ./internal/planner/... ./internal/multiagent/... ./internal/orchestrator/...
      - name: Compose validation
        env:
          OPENAI_API_KEY: test-openai-key
          GEMINI_API_KEY: test-gemini-key
          LITELLM_MASTER_KEY: test-master-key
        run: docker compose -f deploy/litellm/compose.yaml config --quiet
      - name: Hardcoded provider key check
        run: |
          if git grep -nE '(sk-[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{20,})' -- ':!**/*_test.go' ':!records/**'; then
            echo "Potential hardcoded provider key found"
            exit 1
          fi
